[project]
name = "dicompurge"
version = "0.0.5"
description = "DicomPurge - DICOM Deidentification ( PySide6 ) tool for de-identifying burned-in annotations in DICOM images"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "CTSI of SE WI" }]
dependencies = [
    "PySide6>=6.6",
    "pydicom>=2.4",
    "numpy>=1.24",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.1",
    "pillow>=10.0",
    "click>=8.4.2",
    "xnat>=0.8",
]

[project.scripts]
dicompurge = "main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["deid_app*"] # ✅ Prevents the 'images' folder build error


[tool.bumpversion]
current_version = "0.0.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "deid_app/__init__.py"  # Change to your actual package path
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "pytest>=9.1.1",
]
