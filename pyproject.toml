[project]
name = "de-id-python-program"
version = "0.0.3"
description = "Scuppernong - PySide6 tool for de-identifying burned-in annotations in DICOM images"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.6",
    "pydicom>=2.4",
    "numpy>=1.24",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.1",
    "pillow>=10.0",
]

[project.scripts]
de-id = "main:main"

[tool.uv]
package = false
